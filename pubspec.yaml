name: offlineboard
description: "OfflineBoard — an offline-first project & task manager with a durable sync queue."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation (wired up by the presentation layer)
  go_router: ^16.0.0

  # Networking — talks to the in-process mock sync server
  dio: ^5.11.1

  # Persistence / platform
  shared_preferences: ^2.5.5

  # Misc
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
