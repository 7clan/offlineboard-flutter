# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints. The issues identified by the
# analyzer are surfaced in the UI of Dart-enabled IDEs
# (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Generated drift code is machine-written; it is regenerated with
    # build_runner, never hand-edited (but it IS committed for CI).
    - lib/**/*.g.dart
    - android/**
    - ios/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above, or to enable additional lints. A list of all available
  # lints and their documentation is published at https://dart.dev/tools/lints.
  rules:
    # All futures must be explicitly awaited or marked with unawaited() —
    # fire-and-forget is intentional in the sync triggers, never accidental.
    - unawaited_futures

# Additional information about this file can be found at:
# https://dart.dev/guides/language/analysis-options
